<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SesliOda — Sesli Sohbet</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0d13;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #11141d;
      border-bottom: 1px solid #1e2536;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title { font-weight: 700; font-size: 16px; }
    .status { font-size: 12px; color: #94a3b8; }
    .main {
      flex: 1;
      padding: 16px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: #11141d;
      border: 1px solid #1e2536;
      border-radius: 14px;
      padding: 16px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      background: #4f46e5;
    }
    button:active { transform: scale(0.98); }
    .btn-green { background: #059669; }
    .btn-red { background: #dc2626; }
    .btn-gray { background: #1e2536; color: #e2e8f0; }
    .chat-box {
      height: 220px;
      overflow-y: auto;
      background: #0b0d13;
      border: 1px solid #1e2536;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .msg { margin-bottom: 8px; line-height: 1.4; }
    .msg b { color: #818cf8; }
    .chat-form { display: flex; gap: 8px; }
    input {
      flex: 1;
      background: #0b0d13;
      border: 1px solid #2a334a;
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    audio { width: 100%; margin-top: 10px; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <header>
    <div>
      <div class="title">SesliOda</div>
      <div id="conn-status" class="status">Sunucuya bağlanıyor...</div>
    </div>
    <button id="btn-name" type="button" class="btn-gray">Adı Değiştir</button>
  </header>

  <main class="main">
    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>Genel Sesli Oda</strong>
        <span id="voice-state" class="status">Bağlı değil</span>
      </div>
      <div id="meter" class="status" style="margin-top:6px;">Ses seviyesi: 0%</div>

      <div class="controls">
        <button id="btn-join" type="button" class="btn-green">Sesli Odaya Katıl</button>
        <button id="btn-leave" type="button" class="btn-red" style="display:none;">Ayrıl</button>
        <button id="btn-mute" type="button" class="btn-gray">Mikrofon Açık</button>
        <button id="btn-deafen" type="button" class="btn-gray">Ses Açık</button>
      </div>
      <audio id="remote-audio" autoplay playsinline></audio>
    </section>

    <section class="card">
      <strong>Oda Sohbeti</strong>
      <div id="chat-box" class="chat-box"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" maxlength="300" placeholder="Mesaj yaz..." autocomplete="off" />
        <button type="submit">Gönder</button>
      </form>
    </section>
  </main>

  <script>
    (function () {
      let username = localStorage.getItem('seslioda_name') || ('Kullanıcı ' + Math.floor(100 + Math.random() * 899));
      let inVoice = false;
      let muted = false;
      let deafened = false;
      let stream = null;
      let audioCtx = null;
      let analyser = null;
      let rafId = null;

      const connStatus = document.getElementById('conn-status');
      const voiceState = document.getElementById('voice-state');
      const meter = document.getElementById('meter');
      const btnJoin = document.getElementById('btn-join');
      const btnLeave = document.getElementById('btn-leave');
      const btnMute = document.getElementById('btn-mute');
      const btnDeafen = document.getElementById('btn-deafen');
      const btnName = document.getElementById('btn-name');
      const chatBox = document.getElementById('chat-box');
      const chatForm = document.getElementById('chat-form');
      const chatInput = document.getElementById('chat-input');
      const remoteAudio = document.getElementById('remote-audio');

      let socket = null;
      try {
        if (typeof window.io === 'function') {
          socket = window.io();
          socket.on('connect', () => {
            connStatus.textContent = username + ' • Sunucuya bağlı';
          });
          socket.on('disconnect', () => {
            connStatus.textContent = 'Bağlantı kesildi';
          });
          socket.on('group_message', (data) => {
            if (data && data.text) appendMsg(data.author || 'Misafir', data.text);
          });
        } else {
          connStatus.textContent = username + ' • Yerel mod';
        }
      } catch (_) {
        connStatus.textContent = username + ' • Yerel mod';
      }

      function appendMsg(author, text) {
        const div = document.createElement('div');
        div.className = 'msg';
        const b = document.createElement('b');
        b.textContent = author + ': ';
        const span = document.createElement('span');
        span.textContent = text;
        div.appendChild(b);
        div.appendChild(span);
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function startMeter(mediaStream) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
          const src = audioCtx.createMediaStreamSource(mediaStream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 128;
          src.connect(analyser);
          const arr = new Uint8Array(analyser.frequencyBinCount);

          function tick() {
            rafId = requestAnimationFrame(tick);
            if (!inVoice || muted || !analyser) {
              meter.textContent = 'Ses seviyesi: 0%';
              return;
            }
            analyser.getByteFrequencyData(arr);
            let sum = 0;
            for (let i = 0; i < arr.length; i++) sum += arr[i];
            const pct = Math.min(100, Math.round((sum / arr.length / 110) * 100));
            meter.textContent = 'Ses seviyesi: ' + pct + '%';
          }
          tick();
        } catch (_) {}
      }

      function stopMeter() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        if (audioCtx) {
          try { audioCtx.close(); } catch (_) {}
          audioCtx = null;
        }
        meter.textContent = 'Ses seviyesi: 0%';
      }

      btnJoin.addEventListener('click', async () => {
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            stream.getAudioTracks().forEach(t => { t.enabled = !muted; });
            startMeter(stream);
            voiceState.textContent = 'Mikrofon aktif';
          } else {
            voiceState.textContent = 'Odada (mikrofon desteklenmiyor)';
          }
          inVoice = true;
          btnJoin.style.display = 'none';
          btnLeave.style.display = 'inline-block';
          appendMsg('Sistem', username + ' sesli odaya katıldı.');
        } catch (err) {
          inVoice = true;
          btnJoin.style.display = 'none';
          btnLeave.style.display = 'inline-block';
          voiceState.textContent = 'Mikrofon izni verilmedi';
          appendMsg('Sistem', username + ' odaya katıldı (mikrofon kapalı).');
        }
      });

      btnLeave.addEventListener('click', () => {
        inVoice = false;
        stopMeter();
        if (stream) {
          stream.getTracks().forEach(t => t.stop());
          stream = null;
        }
        btnLeave.style.display = 'none';
        btnJoin.style.display = 'inline-block';
        voiceState.textContent = 'Bağlı değil';
        appendMsg('Sistem', username + ' odadan ayrıldı.');
      });

      btnMute.addEventListener('click', () => {
        muted = !muted;
        if (stream) stream.getAudioTracks().forEach(t => { t.enabled = !muted; });
        btnMute.textContent = muted ? 'Mikrofon Kapalı' : 'Mikrofon Açık';
      });

      btnDeafen.addEventListener('click', () => {
        deafened = !deafened;
        remoteAudio.muted = deafened;
        btnDeafen.textContent = deafened ? 'Ses Kapalı' : 'Ses Açık';
      });

      btnName.addEventListener('click', () => {
        const next = prompt('Yeni adın:', username);
        if (next && next.trim()) {
          username = next.trim().slice(0, 24);
          localStorage.setItem('seslioda_name', username);
          connStatus.textContent = username + (socket && socket.connected ? ' • Sunucuya bağlı' : '');
        }
      });

      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const txt = chatInput.value.trim();
        if (!txt) return;
        chatInput.value = '';
        appendMsg(username, txt);
        if (socket && socket.connected) {
          socket.emit('group_message', { author: username, text: txt, chatId: 'genel-grup' });
        }
      });
    })();
  </script>
</body>
</html>
